[auth]
additional_redirect_urls = ["https://www.nexorapay.me/**", "https://nexorapay-demo.vercel.app/**"]
enable_signup = true
site_url = "https://www.nexorapay.me"

[auth.email]
max_frequency = "1m0s"
otp_length = 8

[auth.rate_limit]
email_sent = 30

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[storage.analytics]
enabled = true
max_namespaces = 10

[storage.image_transformation]
enabled = true
